[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adepts"
version = "0.1.0"
description = "Differentiable thermomechanical modelling and inversion examples"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Zhiying Ming"},
  {name = "Jiashun Hu", email = "hujs@sustech.edu.cn"},
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
petsc = ["petsc4py>=3.19"]

[tool.setuptools.packages.find]
where = ["src"]
